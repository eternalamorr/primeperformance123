name: Retry Pending Orders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: "1"
      PG_SSL_REJECT_UNAUTHORIZED: "0"
      PENDING_ORDERS_BATCH_SIZE: ${{ secrets.PENDING_ORDERS_BATCH_SIZE }}
      PENDING_ORDERS_MAX_DELAY_SECONDS: ${{ secrets.PENDING_ORDERS_MAX_DELAY_SECONDS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip if database secret is missing
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL is not set. Skipping." && exit 0

      - name: Retry pending orders
        run: pnpm orders:retry-pending
